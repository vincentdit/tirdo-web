# ==========================================================================
# TIRDO Web Platform - full stack orchestration
# One command:  docker compose up -d --build
# ==========================================================================
name: tirdo

services:
  # ----------------------------------------------------------------------
  # PostgreSQL - primary relational DB (Strapi + Keycloak)
  # ----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tirdo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${STRAPI_DB_NAME},${KEYCLOAK_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # MariaDB - Matomo requires a MySQL-family database
  # ----------------------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: tirdo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MATOMO_DB_NAME}
      MARIADB_USER: ${MATOMO_DB_USER}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Strapi CMS - content for news, publications, projects, pages...
  # ----------------------------------------------------------------------
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: tirdo-cms
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      HOST: 0.0.0.0
      PORT: 1337
      # DB
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STRAPI_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      # Secrets
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      # Blank = admin API uses the same host:port as the browser (LAN :3001).
      STRAPI_PUBLIC_URL: ${STRAPI_PUBLIC_URL:-}
      STRAPI_PROXY: "true"
      STRAPI_CORS_ORIGINS: ${STRAPI_CORS_ORIGINS:-*}
      # MinIO / S3 storage provider
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-${PUBLIC_URL}/cms-media}
      # OpenSearch (for content sync hook)
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
      SEED_DATA: "true"
      # Public website (so a publish in Strapi refreshes Next.js immediately)
      FRONTEND_INTERNAL_URL: http://frontend:3000
      SEARCH_ADMIN_TOKEN: ${SEARCH_ADMIN_TOKEN}
      # Optional: protect GET /api/audit-log/verify (blank = open internally)
      AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN}
      # Email (SMTP) — captured by Mailpit locally
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT}
    # CMS is internal only. Staff use http://<host>/portal; Next talks to cms:1337 on tirdo-net.
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1337/_health',r=>process.exit(r.statusCode>=200&&r.statusCode<300?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Next.js frontend (App Router + TS + Tailwind + shadcn/ui)
  # ----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_STRAPI_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_MATOMO_URL: ${MATOMO_PUBLIC_URL:-http://localhost:${HOST_MATOMO_PORT:-8095}/}
        NEXT_PUBLIC_MATOMO_SITE_ID: "1"
        # First-party analytics paths (proxied to Matomo by Nginx) — evade ad blockers.
        NEXT_PUBLIC_MATOMO_JS_URL: /s/js
        NEXT_PUBLIC_MATOMO_TRACK_URL: /s/e
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-${PUBLIC_URL}/auth}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    container_name: tirdo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      # server-side calls go over the internal docker network
      STRAPI_INTERNAL_URL: http://cms:1337
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
      # Optional: require this token for POST /api/search/reindex.
      SEARCH_ADMIN_TOKEN: ${SEARCH_ADMIN_TOKEN}
      # Matomo reporting API (server-side; token never reaches the browser).
      # Routed via Nginx's internal :8081 upstream, which pins the trusted Host.
      MATOMO_API_URL: http://nginx:8081
      MATOMO_API_TOKEN: ${MATOMO_API_TOKEN}
      MATOMO_SITE_ID: "1"
      PUBLIC_URL: ${PUBLIC_URL}
      # Blank KEYCLOAK_PUBLIC_URL => Sign in uses ${PUBLIC_URL}/auth (nginx). No Dockerfile change.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    depends_on:
      cms:
        condition: service_healthy
      opensearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Keycloak - identity & SSO for all TIRDO systems
  # ----------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tirdo-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tirdo-net]

  # Existing Keycloak DBs ignore realm JSON. This sets tirdo-web redirect URIs
  # from PUBLIC_URL so website Sign in works on :3001. No Dockerfile change.
  keycloak-config:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tirdo-keycloak-config
    restart: on-failure
    entrypoint: ["/bin/bash", "/opt/tirdo/keycloak-set-client.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      PUBLIC_URL: ${PUBLIC_URL}
      KEYCLOAK_URL: http://keycloak:8080/auth
    volumes:
      - ./scripts/keycloak-set-client.sh:/opt/tirdo/keycloak-set-client.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # MinIO - S3-compatible object storage
  # ----------------------------------------------------------------------
  minio:
    image: pgsty/silo:latest
    container_name: tirdo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_MINIO_API_PORT:-9100}:9000"
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # one-shot: create bucket + public policy
  minio-init:
    image: pgsty/mc:latest
    container_name: tirdo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'MinIO bucket ready';
      "
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # OpenSearch - full text search over publications / projects / news
  # ----------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: tirdo-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [tirdo-net]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: tirdo-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      - opensearch
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Matomo - privacy-first institutional analytics
  # ----------------------------------------------------------------------
  matomo:
    image: matomo:5-apache
    container_name: tirdo-matomo
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: mariadb
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
    ports:
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_MATOMO_PORT:-8095}:80"
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Mailpit - local SMTP server that captures outgoing email for testing
  # ----------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tirdo-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${BIND_ADMIN:-127.0.0.1}:${HOST_MAILPIT_PORT:-8025}:8025"   # web UI on the host only
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Nginx - reverse proxy / single public entrypoint (port 80)
  # ----------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: tirdo-nginx
    restart: unless-stopped
    ports:
      - "${BIND_HTTP:-0.0.0.0}:${HOST_HTTP_PORT:-80}:80"
      - "${BIND_HTTP:-0.0.0.0}:${HOST_HTTPS_PORT:-443}:443"   # unused until HTTPS is enabled (scripts/tls-setup.sh)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # TLS certificates (empty until enabled)
      - ./nginx/acme:/var/www/acme:ro       # ACME http-01 challenge webroot
    depends_on:
      - frontend
      - keycloak
    networks: [tirdo-net]

networks:
  tirdo-net:
    driver: bridge

volumes:
  postgres_data:
  mariadb_data:
  strapi_uploads:
  minio_data:
  opensearch_data:
  matomo_data:
