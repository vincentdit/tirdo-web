# ==========================================================================
# TIRDO Web Platform - full stack orchestration
# One command:  docker compose up -d --build
# ==========================================================================
name: tirdo

services:
  # ----------------------------------------------------------------------
  # PostgreSQL - primary relational DB (Strapi + Keycloak)
  # ----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tirdo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${STRAPI_DB_NAME},${KEYCLOAK_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-postgres-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-postgres-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # MariaDB - Matomo requires a MySQL-family database
  # ----------------------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: tirdo-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MATOMO_DB_NAME}
      MARIADB_USER: ${MATOMO_DB_USER}
      MARIADB_PASSWORD: ${MATOMO_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Strapi CMS - content for news, publications, projects, pages...
  # ----------------------------------------------------------------------
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    container_name: tirdo-cms
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      HOST: 0.0.0.0
      PORT: 1337
      # DB
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STRAPI_DB_NAME}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      # Secrets
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      # Public URL (Strapi is exposed directly on host port 1337)
      STRAPI_PUBLIC_URL: http://localhost:1337
      # MinIO / S3 storage provider
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: http://localhost:9100/${MINIO_BUCKET}
      # OpenSearch (for content sync hook)
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
      SEED_DATA: "true"
      # Email (SMTP) — captured by Mailpit locally
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT}
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:1337/_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Next.js frontend (App Router + TS + Tailwind + shadcn/ui)
  # ----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
        NEXT_PUBLIC_MATOMO_URL: http://localhost:8095/
        NEXT_PUBLIC_MATOMO_SITE_ID: "1"
        # First-party analytics paths (proxied to Matomo by Nginx) — evade ad blockers.
        NEXT_PUBLIC_MATOMO_JS_URL: /s/js
        NEXT_PUBLIC_MATOMO_TRACK_URL: /s/e
        NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080/auth
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    container_name: tirdo-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      # server-side calls go over the internal docker network
      STRAPI_INTERNAL_URL: http://cms:1337
      OPENSEARCH_NODE: http://opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX}
    depends_on:
      - cms
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Keycloak - identity & SSO for all TIRDO systems
  # ----------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tirdo-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # MinIO - S3-compatible object storage
  # ----------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: tirdo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tirdo-net]

  # one-shot: create bucket + public policy
  minio-init:
    image: minio/mc:latest
    container_name: tirdo-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      echo 'MinIO bucket ready';
      "
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # OpenSearch - full text search over publications / projects / news
  # ----------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: tirdo-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [tirdo-net]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: tirdo-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Matomo - privacy-first institutional analytics
  # ----------------------------------------------------------------------
  matomo:
    image: matomo:5-apache
    container_name: tirdo-matomo
    restart: unless-stopped
    environment:
      MATOMO_DATABASE_HOST: mariadb
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_DBNAME: ${MATOMO_DB_NAME}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DB_USER}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
    ports:
      - "8095:80"
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Mailpit - local SMTP server that captures outgoing email for testing
  # ----------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tirdo-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # web UI to read captured emails
    networks: [tirdo-net]

  # ----------------------------------------------------------------------
  # Nginx - reverse proxy / single public entrypoint (port 80)
  # ----------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: tirdo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks: [tirdo-net]

networks:
  tirdo-net:
    driver: bridge

volumes:
  postgres_data:
  mariadb_data:
  strapi_uploads:
  minio_data:
  opensearch_data:
  matomo_data:
