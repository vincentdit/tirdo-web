# -----------------------------------------------------------------------
# TLS-enabled edge config. NOT loaded by default — enable it with
# scripts/tls-setup.sh, which puts certificates in place and swaps this in
# for nginx/conf.d/default.conf. See docs/TLS.md.
#
# :80  -> serves the ACME http-01 challenge and redirects everything to HTTPS
# :443 -> the site, with the security headers + rate limits from the HTTP config
# :8081 -> internal Matomo reporting upstream (unchanged)
#
# __DOMAIN__ is replaced with your domain by tls-setup.sh.
# -----------------------------------------------------------------------

server_tokens off;

limit_req_zone  $binary_remote_addr  zone=req_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=req_write:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# gzip is enabled in nginx.conf; only tune it here.
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/plain text/css application/json application/javascript
                  application/xml text/xml image/svg+xml application/rss+xml
                  application/vnd.ms-fontobject font/ttf font/otf;

# --- HTTP :80 — ACME challenge + redirect to HTTPS -------------------------
server {
    listen 80;
    server_name __DOMAIN__;

    # Let's Encrypt http-01 challenge (served from the shared acme webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS :443 — the site -------------------------------------------------
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         30s;

    limit_conn conn_per_ip 50;

    # Security headers — HSTS is now effective over HTTPS.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection          "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; form-action 'self'" always;

    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=req_api burst=20 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/contact {
        limit_req zone=req_write burst=3 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ /\.(?!well-known) { deny all; }

    location = /s/js {
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.js;
        proxy_set_header   Host localhost:8095;
        proxy_set_header   Accept-Encoding "";
        proxy_hide_header  Content-Security-Policy;
    }

    location = /s/e {
        limit_req zone=req_api burst=30 nodelay;
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.php$is_args$args;
        proxy_set_header   Host localhost:8095;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}

# --- Internal Matomo Reporting API upstream (unchanged, http on :8081) ------
server {
    listen 8081;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_matomo_api http://matomo:80;
        proxy_pass         $upstream_matomo_api;
        proxy_set_header   Host localhost:8095;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
