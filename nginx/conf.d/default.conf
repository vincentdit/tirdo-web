# -----------------------------------------------------------------------
# Public entrypoint. Nginx fronts the Next.js site on port 80.
# Uses Docker's embedded DNS (127.0.0.11) with a variable upstream so nginx
# starts even if the frontend container is momentarily unresolvable.
# -----------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
