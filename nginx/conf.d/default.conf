# -----------------------------------------------------------------------
# Public entrypoint. Nginx fronts the Next.js site on port 80.
# Uses Docker's embedded DNS (127.0.0.11) with a variable upstream so nginx
# starts even if the frontend container is momentarily unresolvable.
#
# Hardening: version hidden, security headers, per-endpoint rate limiting,
# connection limits, gzip. See docs/SECURITY.md for the CSP tightening steps.
# -----------------------------------------------------------------------

# --- http-context directives (this file is included inside http {}) --------
server_tokens off;

# Rate-limit zones (keyed by client IP). Tune rates in one place here.
limit_req_zone  $binary_remote_addr  zone=req_api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr  zone=req_write:10m  rate=1r/s;
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

# Preserve WebSocket/HMR upgrades cleanly.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Browser port when the host maps 3001->80. $server_port is 80 inside nginx.
map $http_host $auth_forwarded_port {
    default                 $server_port;
    "~^[^:]+:([0-9]+)$"     $1;
}

# gzip is already enabled by the base image's nginx.conf; only tune it here
# (re-declaring `gzip on` would be a duplicate-directive error).
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/plain text/css application/json application/javascript
                  application/xml text/xml image/svg+xml application/rss+xml
                  application/vnd.ms-fontobject font/ttf font/otf;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upload ceiling (contact form is tiny; CMS media goes through /cms).
    client_max_body_size 100m;
    client_body_timeout  30s;
    client_header_timeout 30s;
    send_timeout         30s;

    # Cap concurrent connections per client IP.
    limit_conn conn_per_ip 50;

    # --- Security response headers (applied to every location that does not
    # set its own add_header). "always" so they're sent on error responses too.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection          "0" always;   # modern browsers: rely on CSP, disable legacy auditor
    # HSTS takes effect once the site is served over HTTPS (ignored over plain HTTP).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP is shipped in Report-Only first so it can't break auth/analytics.
    # Watch the browser console for violations, add any missing sources (e.g.
    # your Keycloak origin under connect-src), then rename to Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; frame-src 'self' http: https:; object-src 'none'; img-src 'self' data: https: http:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https:; form-action 'self' http: https:" always;

    # Keycloak login CSS/JS. Hostname without /auth used to emit /resources/...
    # which Next.js served as HTML (MIME error). Send those files to Keycloak.
    location ^~ /resources/ {
        set $upstream_keycloak http://keycloak:8080;
        rewrite ^/resources/(.*)$ /auth/resources/$1 break;
        proxy_pass         $upstream_keycloak;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_set_header   X-Forwarded-Port $auth_forwarded_port;
        proxy_redirect     off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Keycloak SSO on the same origin as the website so Sign in works on a
    # laptop and on a test server without publishing :8080.
    location ^~ /auth {
        set $upstream_keycloak http://keycloak:8080;
        proxy_pass         $upstream_keycloak;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_set_header   X-Forwarded-Port $auth_forwarded_port;
        proxy_redirect     off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # CMS uploads stored in MinIO. Strapi returns :9100 URLs; the frontend
    # rewrites them to /cms-media so logos load on the same public origin.
    location ^~ /cms-media/ {
        set $upstream_minio http://minio:9000;
        rewrite ^/cms-media/(.*)$ /tirdo-media/$1 break;
        proxy_pass         $upstream_minio;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Application API — moderate rate limit.
    location /api/ {
        limit_req zone=req_api burst=20 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Portal sign-in and password reset — same anti-abuse floor as contact.
    location = /api/portal/login {
        limit_req zone=req_write burst=5 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /api/portal/forgot-password {
        limit_req zone=req_write burst=3 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Contact form — strict anti-spam rate limit.
    location = /api/contact {
        limit_req zone=req_write burst=3 nodelay;
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Strapi admin is not public. Staff use the TIRDO management portal.
    location = /cms { return 302 /portal; }
    location = /cms/ { return 302 /portal; }
    location ^~ /cms/ { return 302 /portal; }
    location = /admin { return 302 /portal; }
    location ^~ /admin { return 302 /portal; }
    location ^~ /content-manager { return 302 /portal; }
    location ^~ /content-type-builder { return 302 /portal; }
    location ^~ /users-permissions { return 302 /portal; }
    location ^~ /i18n { return 302 /portal; }
    location ^~ /upload { return 302 /portal; }

    # Block access to hidden files (e.g. .git, .env) if ever exposed.
    location ~ /\.(?!well-known) { deny all; }

    # -------------------------------------------------------------------
    # First-party analytics proxy. Matomo's tracker (matomo.js) and
    # tracking endpoint (matomo.php) are served under bland, same-origin
    # paths so ad/privacy blockers (which block "matomo.js" / "matomo.php"
    # by name) don't drop the requests. The Matomo dashboard is still at
    # :8095 for admins.
    # -------------------------------------------------------------------
    location = /s/js {
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.js;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   Accept-Encoding "";
        proxy_hide_header  Content-Security-Policy;
    }

    location = /s/e {
        limit_req zone=req_api burst=30 nodelay;
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.php$is_args$args;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}

# -----------------------------------------------------------------------
# Internal-only Matomo Reporting API upstream. NOT published to the host
# (no ports mapping for 8081), so only containers on tirdo-net can reach it.
# The frontend server calls http://nginx:8081/index.php?module=API...; we pin
# the Host to Matomo's trusted install host here because "Host" is a
# forbidden header that fetch() can't set from application code.
# -----------------------------------------------------------------------
server {
    listen 8081;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_matomo_api http://matomo:80;
        proxy_pass         $upstream_matomo_api;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
