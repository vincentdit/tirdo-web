# -----------------------------------------------------------------------
# Public entrypoint. Nginx fronts the Next.js site on port 80.
# Uses Docker's embedded DNS (127.0.0.11) with a variable upstream so nginx
# starts even if the frontend container is momentarily unresolvable.
# -----------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_frontend http://frontend:3000;
        proxy_pass         $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------
    # First-party analytics proxy. Matomo's tracker (matomo.js) and
    # tracking endpoint (matomo.php) are served under bland, same-origin
    # paths so ad/privacy blockers (which block "matomo.js" / "matomo.php"
    # by name) don't drop the requests. The Matomo dashboard is still at
    # :8095 for admins.
    # -------------------------------------------------------------------
    location = /s/js {
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.js;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   Accept-Encoding "";
        proxy_hide_header  Content-Security-Policy;
    }

    location = /s/e {
        set $upstream_matomo http://matomo:80;
        proxy_pass         $upstream_matomo/matomo.php$is_args$args;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}

# -----------------------------------------------------------------------
# Internal-only Matomo Reporting API upstream. NOT published to the host
# (no ports mapping for 8081), so only containers on tirdo-net can reach it.
# The frontend server calls http://nginx:8081/index.php?module=API...; we pin
# the Host to Matomo's trusted install host here because "Host" is a
# forbidden header that fetch() can't set from application code.
# -----------------------------------------------------------------------
server {
    listen 8081;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_matomo_api http://matomo:80;
        proxy_pass         $upstream_matomo_api;
        proxy_set_header   Host localhost:8095;   # Matomo's trusted install host
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
