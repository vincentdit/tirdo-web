# -----------------------------------------------------------------------
# Project-specific ModSecurity / OWASP CRS tuning for the TIRDO site.
# Loaded AFTER the Core Rule Set so these rules can adjust it. Start empty and
# add exclusions only for confirmed false positives found in the audit log
# while running in DetectionOnly mode. See docs/WAF.md.
#
# Rule IDs 10,000,000+ are reserved for site-local rules.
# -----------------------------------------------------------------------

# --- Examples (commented; enable/adapt only if the audit log shows a real
# --- false positive on these endpoints) --------------------------------------

# The analytics beacon carries encoded query strings CRS may flag. If DetectionOnly
# shows false positives on /s/e, relax argument/URL rules for that path only:
# SecRule REQUEST_URI "@beginsWith /s/e" \
#   "id:10000001,phase:1,pass,nolog,ctl:ruleRemoveById=942100,ctl:ruleRemoveById=920273"

# The contact form posts free-text (message body) which can trip SQLi/XSS rules.
# If confirmed false positives appear on /api/contact, remove the specific rule
# IDs the audit log names for the message field only:
# SecRule REQUEST_URI "@streq /api/contact" \
#   "id:10000002,phase:2,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:message,ctl:ruleRemoveTargetById=941100;ARGS:message"

# Allow larger request bodies for CMS uploads if the WAF also fronts :1337
# (by default it only fronts the public site on :80):
# SecRule REQUEST_URI "@beginsWith /uploads" "id:10000003,phase:1,pass,nolog,ctl:requestBodyLimit=26214400"

