# ---------------------------------------------------------------------------
# Opt-in monitoring stack (NFR-AVL). Adds uptime monitoring + a status page
# (Uptime Kuma) and container resource metrics (cAdvisor). It does NOT change
# the running application edge — enable it alongside the base compose:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Then open Uptime Kuma (http://<host>:3001), create the admin account, and add
# HTTP monitors for the endpoints listed in docs/MONITORING.md.
#
# Not runnable in the build environment — validate on your host.
# ---------------------------------------------------------------------------
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: tirdo-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    networks: [tirdo-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tirdo-cadvisor
    restart: unless-stopped
    command: ["--housekeeping_interval=15s", "--docker_only=true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8090:8080"
    networks: [tirdo-net]

volumes:
  uptime_kuma_data:
