name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm test                       # vitest unit tests
      - run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost/cms
          NEXT_PUBLIC_SITE_URL: http://localhost

  e2e:
    name: Frontend - e2e & accessibility (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost
          NEXT_PUBLIC_MATOMO_TRACK_URL: "off"
      - run: npm run test:e2e               # smoke + axe (starts its own server)
        env:
          NEXT_PUBLIC_MATOMO_TRACK_URL: "off"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Frontend - performance (Lighthouse CI)
    runs-on: ubuntu-latest
    continue-on-error: true      # report-only for now (perf/seo/best-practices are warnings)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost
          NEXT_PUBLIC_MATOMO_TRACK_URL: "off"
      - uses: browser-actions/setup-chrome@v1
      - run: npm run test:lighthouse        # lhci: build already done, starts its own server
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

  cms:
    name: CMS - install & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit || true

  security:
    name: Security - dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: npm audit (cms)
        working-directory: cms
        run: npm audit --audit-level=high || true
      - name: Trivy filesystem scan (vulns, secrets, misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report-only for now. Flip to '1' to fail the build on findings.
          exit-code: '0'

  docker:
    name: Validate & build images
    runs-on: ubuntu-latest
    needs: [frontend, cms]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config -q
      - name: Build images
        run: docker compose build

  # Deployment stage - fill in your Ubuntu Server LTS target.
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        run: echo "Add SSH deploy to your Ubuntu Server LTS host here (rsync + docker compose up -d)."
        # Example:
        #   - uses: appleboy/ssh-action@v1
        #     with:
        #       host: ${{ secrets.DEPLOY_HOST }}
        #       username: ${{ secrets.DEPLOY_USER }}
        #       key: ${{ secrets.DEPLOY_SSH_KEY }}
        #       script: cd /opt/tirdo-web && git pull && docker compose up -d --build
