name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend - lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_STRAPI_URL: http://localhost/cms
          NEXT_PUBLIC_SITE_URL: http://localhost

  cms:
    name: CMS - install & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit || true

  docker:
    name: Validate & build images
    runs-on: ubuntu-latest
    needs: [frontend, cms]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Validate compose
        run: docker compose config -q
      - name: Build images
        run: docker compose build

  # Deployment stage - fill in your Ubuntu Server LTS target.
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        run: echo "Add SSH deploy to your Ubuntu Server LTS host here (rsync + docker compose up -d)."
